<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F4F8FC" />
<title>PassVault</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="PassVault" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ===================== TELA: Criar / Desbloquear cofre ===================== -->
  <div id="screen-login" class="screen active">
    <div class="center-content">
      <h2 id="login-title">Desbloquear cofre</h2>
      <p class="hint" id="login-hint">Digite sua senha-mestra.</p>
      <input type="password" id="login-pw1" placeholder="Senha-mestra" autocomplete="current-password" />
      <input type="password" id="login-pw2" placeholder="Confirme a senha-mestra" style="display:none" />
      <div class="error-text" id="login-error"></div>
      <button class="primary" id="login-submit">Desbloquear</button>
      <button id="login-import" style="margin-top:8px">Importar cofre de um arquivo (.db / .pvault)</button>
    </div>
  </div>

  <!-- ===================== TELA: Categorias ===================== -->
  <div id="screen-home" class="screen">
    <div class="topbar">
      <h1>PassVault</h1>
      <button class="icon-btn" id="btn-lock" title="Bloquear">🔒</button>
    </div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Buscar por qualquer campo..." />
    </div>
    <div class="top-actions">
      <button id="btn-export">Baixar cofre (backup)</button>
      <button id="btn-import-2">Importar cofre</button>
    </div>
    <div class="category-grid" id="category-grid"></div>
  </div>

  <!-- ===================== TELA: Lista + Detalhes ===================== -->
  <div id="screen-list" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="btn-back">←</button>
      <h1 id="list-title"></h1>
    </div>
    <div class="entry-list" id="entry-list"></div>
    <div class="detail-panel" id="detail-panel"></div>
    <div class="action-bar">
      <button id="btn-toggle-visible">Mostrar/Ocultar</button>
      <button class="primary" id="btn-new">＋ Nova</button>
      <button id="btn-edit" disabled>Editar</button>
      <button class="danger" id="btn-delete" disabled>Excluir</button>
    </div>
  </div>

  <!-- ===================== MODAL: Nova / Editar entrada ===================== -->
  <div id="modal-entry" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <span id="entry-modal-title">Nova entrada</span>
        <button class="icon-btn" id="entry-modal-close">✕</button>
      </div>
      <div class="modal-form" id="entry-form-fields"></div>
      <div class="checkbox-row">
        <input type="checkbox" id="entry-show-sensitive" />
        <label for="entry-show-sensitive">Mostrar campos sensíveis</label>
        <button id="entry-gen-password" style="margin-left:auto; font-size:12px; padding:6px 10px;">Gerar senha</button>
      </div>
      <div class="error-text" id="entry-form-error"></div>
      <div class="modal-actions">
        <button class="primary" id="entry-save">Salvar</button>
        <button id="entry-cancel">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- ===================== MODAL: Importar cofre ===================== -->
  <div id="modal-import" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <span>Importar cofre</span>
        <button class="icon-btn" id="import-modal-close">✕</button>
      </div>
      <div class="modal-form">
        <p class="hint">
          Escolha um arquivo <code>vault.db</code> ou <code>.pvault</code> e digite a senha
          correspondente. <strong>Isso substitui totalmente o cofre atual deste dispositivo</strong>
          — se quiser manter uma cópia do que já está aqui, baixe um backup antes.
        </p>
        <label class="field-label">Arquivo</label>
        <input type="file" id="import-file-input" accept=".db,.pvault" />
        <label class="field-label">Senha</label>
        <input type="password" id="import-password" placeholder="Senha-mestra ou de compartilhamento" />
        <div class="error-text" id="import-error"></div>
      </div>
      <div class="modal-actions">
        <button class="primary" id="import-confirm">Importar (substituir)</button>
        <button id="import-cancel">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="vendor/argon2-bundled.min.js"></script>
  <script src="js/schemas.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/db.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
